name: Security Lab CI & CSPM Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Unit Test Suite
        run: python3 -m unittest discover -s tests -v

      - name: Run CSPM & IAM Posture Audit
        run: python3 main.py cloud-audit cspm/lab_targets
