name: Sync Threat Intelligence Feeds

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Abuse.ch & CISA KEV feeds
        run: python3 main.py sync-intel

      - name: Commit updated IoC snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_iocs.txt
          git diff --staged --quiet || git commit -m "chore(intel): update Abuse.ch and CISA KEV snapshot"
          git push
