name: Automated Lab Maintenance & Posture Refresh

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Sync Threat Intel, Audit Cloud IaC & Refresh Reports
        run: |
          python3 main.py sync-intel
          python3 main.py cloud-audit cspm/lab_targets
          python3 main.py risk-report
          python3 main.py ship-elk

      - name: Commit updated intelligence & GRC reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_iocs.txt data/ecs_telemetry.ndjson reports/RISK_REGISTER.md
          git diff --staged --quiet || git commit -m "chore(auto-maint): refresh threat intel, GRC risk register & ECS telemetry"
          git push
