name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Page or command
      placeholder: "/admin, ./scripts/ship.sh minor"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Android phone, Firefox"
